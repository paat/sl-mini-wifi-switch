name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and assemble release
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew test :app:assembleRelease

      - name: Verify signature, checksum, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$build_tools"
          test -x "$build_tools/apksigner"
          src="app/build/outputs/apk/release/app-release.apk"
          test -f "$src"
          version_name="$(sed -n 's/^app-name *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)"
          version_code="$(sed -n 's/^app-code *= *"\(.*\)"/\1/p' gradle/libs.versions.toml)"
          test -n "$version_name"
          test -n "$version_code"
          notes="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          test -f "$notes"
          out_dir="$RUNNER_TEMP/release-out"
          mkdir -p "$out_dir"
          apk_name="mini-wifi-switch-${version_name}.apk"
          cp "$src" "$out_dir/$apk_name"
          "$build_tools/apksigner" verify --print-certs "$out_dir/$apk_name"
          (
            cd "$out_dir"
            sha256sum "$apk_name" > "${apk_name}.sha256"
          )
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == *-* || "$tag" == v0* ]]; then
            gh release create "$tag" \
              "$out_dir/$apk_name" \
              "$out_dir/${apk_name}.sha256" \
              --title "$tag" \
              --notes-file "$notes" \
              --prerelease
          else
            gh release create "$tag" \
              "$out_dir/$apk_name" \
              "$out_dir/${apk_name}.sha256" \
              --title "$tag" \
              --notes-file "$notes"
          fi
